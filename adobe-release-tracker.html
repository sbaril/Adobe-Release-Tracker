<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adobe Release Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0e0e10; --bg2:#18181c; --bg3:#222228;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0eff4; --muted:#8a8a9a; --hint:#55555f;
  --radius:10px; --radius-lg:14px; --beta:#fbbf24;
  --header-h:54px;
}
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:400; line-height:1.6; min-height:100vh; }

/* ── Desktop layout ─────────────────────────────────────────────────────── */
.layout { display:grid; grid-template-columns:240px 1fr; grid-template-rows:auto 1fr; min-height:100vh; }

header { grid-column:1/-1; border-bottom:1px solid var(--border); padding:0 28px; height:var(--header-h); display:flex; align-items:center; justify-content:space-between; background:var(--bg); position:sticky; top:0; z-index:30; }
.header-title { display:flex; align-items:center; gap:10px; min-width:0; }
.logo { width:28px; height:28px; background:linear-gradient(135deg,#FF9A00,#FF3366); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; color:white; font-family:'DM Mono',monospace; flex-shrink:0; }
header h1 { font-size:14px; font-weight:500; white-space:nowrap; }
.header-sub { font-size:12px; color:var(--muted); margin-left:14px; white-space:nowrap; }
.tag-updated { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; border:1px solid var(--border); padding:3px 8px; border-radius:6px; white-space:nowrap; flex-shrink:0; }
.hamburger { display:none; background:none; border:none; cursor:pointer; color:var(--muted); padding:6px; border-radius:6px; flex-shrink:0; }
.hamburger:hover { color:var(--text); background:var(--bg2); }

/* Desktop sidebar */
aside { border-right:1px solid var(--border); padding:14px 0 24px; background:var(--bg); position:sticky; top:var(--header-h); height:calc(100vh - var(--header-h)); overflow-y:auto; }
.section-label { font-size:10px; font-weight:500; color:var(--hint); letter-spacing:.08em; text-transform:uppercase; padding:10px 16px 4px; display:flex; align-items:center; gap:6px; }
.section-label.beta-label { color:#92620a; }
.beta-dot { width:6px; height:6px; border-radius:50%; background:var(--beta); flex-shrink:0; }
.app-btn { display:flex; align-items:center; gap:9px; width:100%; padding:7px 16px; background:none; border:none; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:400; text-align:left; transition:color .12s,background .12s; border-left:2px solid transparent; }
.app-btn:hover { color:var(--text); background:var(--bg2); }
.app-btn.active { color:var(--text); background:var(--bg2); font-weight:500; }
.app-btn.beta-btn { font-style:italic; }
.app-icon { width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:8px; font-weight:500; flex-shrink:0; }
.rel-count { margin-left:auto; font-size:10px; color:var(--hint); font-family:'DM Mono',monospace; }
.sidebar-divider { height:1px; background:var(--border); margin:8px 16px; }
.sidebar-footer { padding:10px 16px; }
.ext-link { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:7px; font-family:'DM Sans',sans-serif; font-size:11px; color:var(--muted); text-decoration:none; border:1px solid var(--border2); background:var(--bg2); transition:color .12s; width:100%; justify-content:center; }
.ext-link:hover { color:var(--text); }

/* Mobile drawer overlay */
.drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; backdrop-filter:blur(2px); }
.drawer-overlay.open { display:block; }
.mobile-drawer {
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--bg2); border-top:1px solid var(--border2);
  border-radius:16px 16px 0 0;
  max-height:80vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  padding:0 0 env(safe-area-inset-bottom,16px);
}
.mobile-drawer.open { transform:translateY(0); }
.drawer-handle { width:36px; height:4px; background:var(--border2); border-radius:2px; margin:12px auto 8px; }
.drawer-title { font-size:11px; font-weight:500; color:var(--hint); letter-spacing:.08em; text-transform:uppercase; padding:4px 16px 8px; }

/* Active app chip — mobile only */
.active-chip { display:none; }

/* Main content */
main { padding:28px 32px 48px; max-width:880px; }
.app-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; gap:16px; }
.app-header-left { display:flex; align-items:center; gap:12px; }
.app-icon-lg { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:12px; font-weight:500; flex-shrink:0; }
.app-name { font-size:17px; font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.beta-badge-title { font-size:11px; font-weight:500; padding:2px 7px; border-radius:4px; background:#fbbf2422; color:var(--beta); border:1px solid #fbbf2444; letter-spacing:.03em; font-style:normal; }
.app-meta { font-size:12px; color:var(--muted); margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:7px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; border:1px solid var(--border2); background:var(--bg2); color:var(--muted); text-decoration:none; transition:color .12s,background .12s; white-space:nowrap; }
.btn:hover { color:var(--text); background:var(--bg3); }
.beta-notice { margin-bottom:20px; padding:12px 15px; background:#fbbf2410; border:1px solid #fbbf2430; border-radius:var(--radius); font-size:12px; color:#c89a30; line-height:1.6; display:flex; gap:9px; align-items:flex-start; }
.beta-notice-icon { flex-shrink:0; margin-top:1px; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
.stat-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
.stat-value { font-size:20px; font-weight:500; font-family:'DM Mono',monospace; }
.releases-list { display:flex; flex-direction:column; gap:7px; }
.release-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; transition:border-color .12s; }
.release-card:hover { border-color:var(--border2); }
.release-card.beta-card { border-color:#fbbf2422; }
.release-card.beta-card:hover { border-color:#fbbf2466; }
.release-header { display:flex; align-items:center; justify-content:space-between; padding:11px 15px; cursor:pointer; user-select:none; gap:12px; }
.release-header-left { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.v-badge { font-family:'DM Mono',monospace; font-size:10px; padding:2px 7px; border-radius:5px; font-weight:500; white-space:nowrap; }
.rel-name { font-size:13px; font-weight:500; }
.new-badge { font-size:10px; font-weight:500; padding:2px 6px; border-radius:4px; background:#22c55e22; color:#4ade80; border:1px solid #22c55e33; }
.beta-tag { font-size:10px; font-weight:500; padding:2px 6px; border-radius:4px; background:#fbbf2422; color:var(--beta); border:1px solid #fbbf2433; }
.release-header-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.rel-date { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; white-space:nowrap; }
.chevron { width:14px; height:14px; color:var(--hint); transition:transform .18s; flex-shrink:0; }
.chevron.open { transform:rotate(180deg); }
.features-list { border-top:1px solid var(--border); display:none; }
.features-list.open { display:block; }
.feature-item { display:flex; align-items:flex-start; gap:9px; padding:7px 15px; border-bottom:1px solid var(--border); }
.feature-item:last-child { border-bottom:none; }
.f-arrow { flex-shrink:0; margin-top:4px; color:var(--hint); }
.f-link { font-size:13px; color:var(--text); text-decoration:none; line-height:1.5; transition:color .1s; }
.f-link:hover { color:#93c5fd; }
.info-bar { margin-top:16px; padding:10px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); font-size:12px; color:var(--muted); line-height:1.6; display:flex; gap:9px; align-items:flex-start; }
.relnotes-item { display:flex; align-items:center; gap:9px; padding:7px 15px; border-top:1px solid var(--border); background:var(--bg); }
.relnotes-link { font-size:12px; color:var(--hint); text-decoration:none; display:flex; align-items:center; gap:5px; font-style:italic; transition:color .1s; }
.relnotes-link:hover { color:var(--muted); }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

/* ── Mobile ─────────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  :root { --header-h:50px; }

  /* Single-column layout */
  .layout { grid-template-columns:1fr; grid-template-rows:auto 1fr; }

  /* Header */
  header { padding:0 16px; }
  .header-sub { display:none; }
  .tag-updated { font-size:10px; padding:2px 6px; }
  .hamburger { display:flex; align-items:center; justify-content:center; margin-left:8px; }

  /* Hide desktop sidebar */
  aside { display:none; }

  /* Show mobile drawer */
  .mobile-drawer { display:block; }

  /* Active app chip bar below header */
  .active-chip {
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-bottom:1px solid var(--border);
    background:var(--bg); position:sticky; top:var(--header-h); z-index:20;
  }
  .active-chip-icon { width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:7px; font-weight:500; flex-shrink:0; }
  .active-chip-name { font-size:13px; font-weight:500; flex:1; }
  .active-chip-change { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px; border:1px solid var(--border); font-family:'DM Sans',sans-serif; }

  /* Main content tighter */
  main { padding:16px 16px 80px; }
  .app-header { flex-direction:column; gap:10px; margin-bottom:16px; }
  .app-header-left { gap:10px; }
  .app-icon-lg { width:36px; height:36px; font-size:10px; }
  .app-name { font-size:15px; }
  .app-meta { font-size:11px; }

  /* Stats: 2+1 on small screens */
  .stats-row { grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px; }
  .stats-row .stat-card:last-child { grid-column:span 2; }
  .stat-value { font-size:18px; }
  .stat-label { font-size:10px; }

  /* Release cards */
  .release-header { padding:10px 13px; gap:8px; }
  .v-badge { font-size:9px; }
  .rel-name { font-size:12px; }
  .rel-date { font-size:10px; }
  .feature-item { padding:8px 13px; gap:8px; }
  .f-link { font-size:12px; }
  .relnotes-item { padding:8px 13px; }

  /* Bigger tap targets */
  .release-header { min-height:48px; }
  .app-btn { min-height:46px; padding:10px 16px; font-size:13px; }
  .app-icon { width:26px; height:26px; font-size:9px; }

  /* Info bar */
  .info-bar { font-size:11px; margin-top:14px; }

  /* Beta notice */
  .beta-notice { font-size:11px; }
}
</style>
</head>
<body>
<div class="layout">
<header>
  <div class="header-title">
    <div class="logo">ART</div>
    <h1>Adobe Release Tracker</h1>
    <span class="header-sub">23 apps · weekly tracker</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">

    <button class="hamburger" id="hamburger-btn" aria-label="Open app list">

    </button>
  </div>
</header>

<!-- Active app chip — visible on mobile only -->
<div class="active-chip" id="active-chip">
  <span class="active-chip-icon" id="chip-icon"></span>
  <span class="active-chip-name" id="chip-name"></span>
  <button class="active-chip-change" id="chip-change-btn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    Change app
  </button>
</div>

<aside>
  <div id="sidebar-apps"></div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-footer">
    <a href="https://helpx.adobe.com" target="_blank" class="ext-link">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Adobe Help Center
    </a>
  </div>
</aside>

<!-- Mobile drawer overlay -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<!-- Mobile bottom drawer -->
<div class="mobile-drawer" id="mobile-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">Select an app</div>
  <div id="drawer-apps"></div>
  <div style="height:16px"></div>
</div>

<main id="main-content"></main>
</div>

    {name:"Audio channel label on timeline — show/hide from the timeline wrench menu",url:"https://helpx.adobe.com/premiere/desktop/whats-new/beta-features.html"},
    {name:"Scripting API for Preset object and ProjectConverter export/import",url:"https://helpx.adobe.com/premiere/desktop/whats-new/beta-features.html"},
  ]},
]},

illustratorweb:{lastChecked:"2026-06-04",isBeta:true,releases:[
  {version:"Web Beta",name:"Illustrator on the Web (beta)",date:"Ongoing",isBeta:true,features:[
    {name:"Simplified workspace — modern browser-based interface for Illustrator",url:"https://helpx.adobe.com/illustrator/web/get-set-up/learn-the-basics/overview.html"},
    {name:"Quick Pen Tool (beta) — draw custom shapes directly in the browser",url:"https://helpx.adobe.com/illustrator/web/get-set-up/learn-the-basics/overview.html"},
    {name:"Cloud documents (.aic) — auto-saved, accessible on desktop, web, and iPad",url:"https://helpx.adobe.com/illustrator/web/start-projects/access-files/cloud-documents-overview.html"},
    {name:"Collaboration — share a link so collaborators can open and edit without installing the app",url:"https://helpx.adobe.com/illustrator/web/get-set-up/learn-the-basics/overview.html"},
    {name:"Full document fidelity — open and edit .aic files without loss",url:"https://helpx.adobe.com/illustrator/web/get-set-up/learn-the-basics/overview.html"},
    {name:"Core desktop features in the browser — logos, marketing graphics, and illustrations",url:"https://helpx.adobe.com/illustrator/web/get-set-up/learn-the-basics/overview.html"},
  ]},
]},
};

let activeApp = "illustrator";
const openReleases = new Set();
function hex(c,a){return c+Math.round(a*255).toString(16).padStart(2,"0");}

// ── Drawer ────────────────────────────────────────────────────────────────
function openDrawer(){
  document.getElementById("mobile-drawer").classList.add("open");
  document.getElementById("drawer-overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeDrawer(){
  document.getElementById("mobile-drawer").classList.remove("open");
  document.getElementById("drawer-overlay").classList.remove("open");
  document.body.style.overflow="";
}
document.getElementById("hamburger-btn").addEventListener("click", openDrawer);
document.getElementById("chip-change-btn").addEventListener("click", openDrawer);
document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);

// ── Active chip update ────────────────────────────────────────────────────
function updateChip(){
  const app = APPS[activeApp];
  const icon = document.getElementById("chip-icon");
  const name = document.getElementById("chip-name");
  icon.textContent = app.icon;
  icon.style.background = hex(app.color, 0.2);
  icon.style.color = app.color;
  name.textContent = app.name;
  name.style.color = app.color;
}

// ── Build drawer app list ─────────────────────────────────────────────────
function buildDrawer(){
  const el = document.getElementById("drawer-apps");
  el.innerHTML = "";
  GROUPS.forEach((group, gi) => {
    if(gi > 0){ const d=document.createElement("div"); d.className="sidebar-divider"; d.style.margin="4px 16px"; el.appendChild(d); }
    const lbl = document.createElement("div");
    lbl.className = "section-label" + (group.isBeta?" beta-label":"");
    lbl.innerHTML = group.isBeta ? `<span class="beta-dot"></span>${group.label}` : group.label;
    el.appendChild(lbl);
    group.ids.forEach(id => {
      const app = APPS[id];
      const d = DATA[id];
      const total = d.releases.reduce((a,r)=>a+r.features.length,0);
      const btn = document.createElement("button");
      btn.className = "app-btn" + (id===activeApp?" active":"") + (app.isBeta?" beta-btn":"");
      btn.style.borderLeftColor = id===activeApp ? app.color : "transparent";
      btn.innerHTML = `<span class="app-icon" style="background:${hex(app.color,id===activeApp?0.2:0.1)};color:${app.color}">${app.icon}</span>${app.name}<span class="rel-count">${total}</span>`;
      btn.addEventListener("click",()=>{
        activeApp=id;
        buildSidebar();
        buildDrawer();
        buildMain();
        updateChip();
        closeDrawer();
        window.scrollTo({top:0,behavior:"smooth"});
      });
      el.appendChild(btn);
    });
  });
}

function buildSidebar(){
  const el = document.getElementById("sidebar-apps");
  el.innerHTML = "";
  GROUPS.forEach((group,gi) => {
    if(gi > 0){const d=document.createElement("div");d.className="sidebar-divider";d.style.margin="6px 16px";el.appendChild(d);}
    const lbl = document.createElement("div");
    lbl.className = "section-label" + (group.isBeta ? " beta-label" : "");
    lbl.innerHTML = group.isBeta ? `<span class="beta-dot"></span>${group.label}` : group.label;
    el.appendChild(lbl);
    group.ids.forEach(id => {
      const app = APPS[id];
      const d = DATA[id];
      const total = d.releases.reduce((a,r)=>a+r.features.length,0);
      const btn = document.createElement("button");
      btn.className = "app-btn" + (id===activeApp?" active":"") + (app.isBeta?" beta-btn":"");
      btn.style.borderLeftColor = id===activeApp ? app.color : "transparent";
      btn.innerHTML = `<span class="app-icon" style="background:${hex(app.color,id===activeApp?0.2:0.1)};color:${app.color}">${app.icon}</span>${app.name}<span class="rel-count">${total}</span>`;
      btn.addEventListener("click",()=>{activeApp=id;buildSidebar();buildDrawer();buildMain();updateChip();});
      el.appendChild(btn);
    });
  });
}

function buildMain(){
  const app = APPS[activeApp];
  const d = DATA[activeApp];
  const total = d.releases.reduce((a,r)=>a+r.features.length,0);
  const newCt = d.releases.reduce((a,r)=>a+(r.isNew?r.features.length:0),0);
  const betaNoticeHTML = app.isBeta ? `
    <div class="beta-notice">
      <svg class="beta-notice-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>This page covers <strong>beta features</strong> — they may change or never reach stable release. Weekly beta builds may contain bugs. Use the stable version for all production work.</span>
    </div>` : "";
  document.getElementById("main-content").innerHTML = `
    <div class="app-header">
      <div class="app-header-left">
        <div class="app-icon-lg" style="background:${hex(app.color,0.15)};color:${app.color};border:1.5px solid ${hex(app.color,0.25)}">${app.icon}</div>
        <div>
          <div class="app-name">${app.name}${app.isBeta?'<span class="beta-badge-title">BETA</span>':''}</div>
          <div class="app-meta">Last checked: ${d.lastChecked} · ${d.releases.length} release${d.releases.length>1?"s":""} tracked</div>
        </div>
      </div>
      <a href="${app.url}" target="_blank" class="btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Official page
      </a>
    </div>
    ${betaNoticeHTML}
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Tracked releases</div><div class="stat-value" style="color:${app.color}">${d.releases.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total features</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">New since last check</div><div class="stat-value" style="color:${newCt>0?"#4ade80":"var(--muted)"}">${newCt}</div></div>
    </div>
    <div class="releases-list" id="releases-list"></div>
    <div class="info-bar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px;color:var(--hint)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Click a release to expand its features. Links open the official Adobe Help Center or Experience League documentation. Update weekly by asking Claude.</span>
    </div>`;
  const list = document.getElementById("releases-list");
  d.releases.forEach((rel,i) => {
    const key = `${activeApp}-${i}`;
    const isOpen = openReleases.has(key);
    const isBetaCard = rel.isBeta || app.isBeta;
    const card = document.createElement("div");
    card.className = "release-card" + (isBetaCard?" beta-card":"");
    card.innerHTML = `
      <div class="release-header">
        <div class="release-header-left">
          <span class="v-badge" style="background:${hex(app.color,0.12)};color:${app.color}">v${rel.version}</span>
          <span class="rel-name">${rel.name}</span>
          ${rel.isNew?'<span class="new-badge">NEW</span>':""}
          ${isBetaCard?'<span class="beta-tag">BETA</span>':""}
        </div>
        <div class="release-header-right">
          <span class="rel-date">${rel.date}</span>
          <svg class="chevron ${isOpen?"open":""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="features-list ${isOpen?"open":""}" id="fl-${key}">
        ${rel.features.map(f=>`<div class="feature-item"><svg class="f-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg><a href="${f.url}" target="_blank" class="f-link">${f.name}</a></div>`).join("")}
        ${app.releaseNotesUrl?`<div class="relnotes-item"><a href="${app.releaseNotesUrl}" target="_blank" class="relnotes-link"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Full release notes →</a></div>`:""}
      </div>`;
    card.querySelector(".release-header").addEventListener("click",()=>{
      openReleases.has(key)?openReleases.delete(key):openReleases.add(key);
      document.getElementById(`fl-${key}`).classList.toggle("open");
      card.querySelector(".chevron").classList.toggle("open");
    });
    list.appendChild(card);
  });
}

buildSidebar();
buildDrawer();
buildMain();
updateChip();
</script>
</body>
</html>
